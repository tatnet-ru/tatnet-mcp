name: image

# Образ сервера для Apps Platform: апп берёт его по НЕИЗМЕНЯЕМОМУ тегу
# (sha коммита), а не по плавающему latest — иначе пересборка аппа молча
# подтягивала бы непроверенную версию.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}
          tags: |
            ghcr.io/tatnet-ru/tatnet-mcp:${{ github.sha }}
            ghcr.io/tatnet-ru/tatnet-mcp:${{ github.ref_name }}
